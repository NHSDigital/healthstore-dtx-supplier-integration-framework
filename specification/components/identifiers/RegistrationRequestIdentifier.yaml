title: RegistrationRequestIdentifier
description: |
  Identifies the registration request, not the registration. Stable across
  redeliveries.
type: object
required:
  - system
  - value
properties:
  system:
    type: string
    enum:
      - 'https://fhir.healthstore.nhs.uk/Id/registration-request'
  value:
    type: string
    format: uuid
    example: 5f3c1b0e-9d4a-4c7b-8e21-64b0a1f2c9d7
