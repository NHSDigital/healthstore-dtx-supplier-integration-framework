description: |
  The bearer token or the patient's ID token was refused. Every code here is
  terminal: do not retry the same request. For a bearer failure, obtain a
  new access token. For an ID token failure, re-authenticate the patient
  with NHS login and retry with the new token.

  | Error code | Description |
  |---|---|
  | NO_ACCESS | No bearer token, or a bearer token that is invalid or expired |
  | TOKEN_INVALID | The ID token is malformed, its signature does not verify, or its iss is not NHS login for this environment |
  | TOKEN_EXPIRED | The ID token's exp has passed |
  | WRONG_AUDIENCE | The ID token's aud is not the NHS login client id registered for the calling credential |
  | PROOFING_BELOW_P9 | The ID token's identity_proofing_level is below P9 |
  | NHS_NUMBER_MISSING | The ID token carries no NHS number |
headers:
  X-Request-ID:
    $ref: '../headers/response/XRequestID.yaml'
  X-Correlation-ID:
    $ref: '../headers/response/XCorrelationID.yaml'
content:
  application/fhir+json:
    schema:
      $ref: '../schemas/OperationOutcome.yaml'
    examples:
      no-access:
        summary: Bearer token missing, invalid or expired
        value:
          resourceType: OperationOutcome
          issue:
            - severity: error
              code: login
              details:
                coding:
                  - code: NO_ACCESS
              diagnostics: No token, or a token that is invalid or expired
      token-expired:
        summary: ID token expired
        value:
          resourceType: OperationOutcome
          issue:
            - severity: error
              code: expired
              details:
                coding:
                  - code: TOKEN_EXPIRED
              diagnostics: The ID token expired at 2026-09-26T10:15:00Z
              expression:
                - id_token
      wrong-audience:
        summary: ID token issued to a different client
        value:
          resourceType: OperationOutcome
          issue:
            - severity: error
              code: security
              details:
                coding:
                  - code: WRONG_AUDIENCE
              diagnostics: The ID token's aud does not match the NHS login client id registered for this credential
              expression:
                - id_token
