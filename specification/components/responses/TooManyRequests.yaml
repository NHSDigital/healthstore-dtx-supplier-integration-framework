description: |
  Rate exceeded. Retryable: wait at least Retry-After seconds. Limits are
  per-credential abuse guards, set generously above expected sign-in
  volumes; see docs/registration-api/resources.md.

  | Error code | Description |
  |---|---|
  | TOO_MANY_REQUESTS | Rate exceeded |
headers:
  Retry-After:
    $ref: '../headers/response/RetryAfter.yaml'
  X-Request-ID:
    $ref: '../headers/response/XRequestID.yaml'
  X-Correlation-ID:
    $ref: '../headers/response/XCorrelationID.yaml'
content:
  application/fhir+json:
    schema:
      $ref: '../schemas/OperationOutcome.yaml'
    example:
      resourceType: OperationOutcome
      issue:
        - severity: error
          code: throttled
          details:
            coding:
              - code: TOO_MANY_REQUESTS
          diagnostics: Rate exceeded
