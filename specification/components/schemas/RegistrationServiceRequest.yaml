title: RegistrationServiceRequest
description: |
  A registration: a UKCore-ServiceRequest carrying four data-bearing
  fields, plus the interim demographics on the contained Patient until the
  DTx platform's NHS login scopes are granted. The four: the registration
  identifier, the intervention code, the
  contracting organisation (an extension carrying its ODS code) and the
  patient's administrative gender (a contained Patient). Everything else the
  DTx supplier needs about the patient comes from its own NHS login
  /userinfo call.

  code replaces v0.1's care_path_code and is now required.

  The contracting organisation is an extension rather than a contained
  Coverage. UK Core does not profile Coverage, and an unprofiled US-realm
  financial resource invites interoperability challenge, whereas
  realm-specific extensions are UK Core's own standard mechanism. The
  extension also keeps the payload to a single contained resource with no
  insurance element. It is named contracting, not commissioning, because
  the NHS Data Dictionary's ORGANISATION IDENTIFIER (CODE OF COMMISSIONER)
  means the statutory commissioner of activity, whereas this field
  identifies the organisation that contracts with and is charged by the
  DTx supplier. In private beta they are the same organisation; they need
  not remain so.
type: object
required:
  - resourceType
  - meta
  - contained
  - extension
  - identifier
  - status
  - intent
  - code
  - subject
properties:
  resourceType:
    type: string
    enum:
      - ServiceRequest
  meta:
    type: object
    required:
      - profile
    properties:
      profile:
        type: array
        minItems: 1
        maxItems: 1
        items:
          type: string
          enum:
            - 'https://fhir.hl7.org.uk/StructureDefinition/UKCore-ServiceRequest'
  contained:
    type: array
    minItems: 1
    maxItems: 1
    description: The contained Patient.
    items:
      $ref: './ContainedPatient.yaml'
  extension:
    type: array
    minItems: 1
    maxItems: 1
    description: |
      The contracting organisation, identified by ODS code: the organisation
      the DTx supplier contracts with and charges, and the reporting anchor
      for the registration. Not the Data Dictionary's CODE OF COMMISSIONER.
    items:
      type: object
      required:
        - url
        - valueIdentifier
      properties:
        url:
          type: string
          enum:
            - 'https://fhir.dtx.national.nhs.uk/StructureDefinition/Extension-ContractingOrganisation'
        valueIdentifier:
          type: object
          required:
            - system
            - value
          properties:
            system:
              type: string
              enum:
                - 'https://fhir.nhs.uk/Id/ods-organization-code'
            value:
              type: string
              description: The ODS code of the contracting organisation.
  identifier:
    type: array
    minItems: 1
    maxItems: 1
    description: The registration identifier. Keys retrieval, acknowledgement and usage reporting.
    items:
      $ref: '../identifiers/RegistrationIdentifier.yaml'
  status:
    type: string
    enum:
      - active
    description: Always active. Only open registrations are returned.
  intent:
    type: string
    enum:
      - order
  code:
    $ref: '../codesystems/InterventionCode.yaml'
  subject:
    type: object
    required:
      - reference
    description: The contained Patient.
    properties:
      reference:
        type: string
        pattern: '^#'
