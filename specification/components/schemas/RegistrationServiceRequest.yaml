title: RegistrationServiceRequest
description: |
  A registration: a ServiceRequest retrieved whole, with its Patient
  contained and referenced from subject.
type: object
required:
  - resourceType
  - identifier
  - status
  - intent
  - subject
  - contained
properties:
  resourceType:
    type: string
    enum:
      - ServiceRequest
  contained:
    type: array
    minItems: 1
    description: Includes at least the Patient.
    items:
      $ref: './ContainedPatient.yaml'
  identifier:
    type: array
    minItems: 1
    maxItems: 1
    description: The registration identifier.
    items:
      $ref: '../identifiers/RegistrationIdentifier.yaml'
  status:
    type: string
    enum:
      - draft
      - active
      - on-hold
      - revoked
      - completed
      - entered-in-error
      - unknown
    description: Bound to request-status. active when submitted.
  intent:
    type: string
    enum:
      - order
  subject:
    type: object
    required:
      - reference
    description: The contained Patient.
    properties:
      reference:
        type: string
        pattern: '^#'
  code:
    type: object
    description: Coded digital therapeutic programme or pathway.
    properties:
      coding:
        type: array
        items:
          $ref: './Coding.yaml'
      text:
        type: string
  authoredOn:
    type: string
    format: date-time
    description: The practitioner's act that made the request actionable.
  requester:
    $ref: './OdsReference.yaml'
  performer:
    type: array
    description: Intended digital therapeutic provider or service.
    items:
      $ref: './OdsReference.yaml'
  reasonCode:
    type: array
    description: Clinical indication.
    items:
      $ref: './CodeableConcept.yaml'
  priority:
    $ref: './RequestPriority.yaml'
