get:
  operationId: getRegistration
  tags:
    - registrations
  summary: Retrieve one registration
  description: |
    Returns the registration whole, as a ServiceRequest with its Patient
    contained.
  parameters:
    - $ref: '../pathParameters/RegistrationId.yaml'
    - $ref: '../headers/request/XRequestID.yaml'
    - $ref: '../headers/request/XCorrelationID.yaml'
  responses:
    '200':
      description: The registration.
      headers:
        X-Request-ID:
          $ref: '../headers/response/XRequestID.yaml'
        X-Correlation-ID:
          $ref: '../headers/response/XCorrelationID.yaml'
      content:
        application/fhir+json:
          schema:
            $ref: '../schemas/RegistrationServiceRequest.yaml'
          example:
            resourceType: ServiceRequest
            contained:
              - resourceType: Patient
                id: patient
                identifier:
                  - system: 'https://fhir.nhs.uk/Id/nhs-number'
                    value: '9000000009'
                    extension:
                      - url: 'https://fhir.hl7.org.uk/StructureDefinition/Extension-UKCore-NHSNumberVerificationStatus'
                        valueCodeableConcept:
                          coding:
                            - system: 'https://fhir.hl7.org.uk/CodeSystem/UKCore-NHSNumberVerificationStatusEngland'
                              code: '01'
                              display: Number present and verified
                name:
                  - use: official
                    family: Smith
                    given:
                      - Jane
                telecom:
                  - system: email
                    value: jane.smith@example.com
                    use: home
                  - system: phone
                    value: '+447700900123'
                    use: mobile
                gender: female
                birthDate: '1980-01-15'
                address:
                  - country: GB
                generalPractitioner:
                  - identifier:
                      system: 'https://fhir.nhs.uk/Id/ods-organization-code'
                      value: A81001
                    display: Example Medical Practice
            identifier:
              - system: 'https://fhir.healthstore.nhs.uk/Id/registration'
                value: 0b93b9a2-6ac2-4d31-a3d0-7c3ef1a29a3f
            status: active
            intent: order
            priority: asap
            subject:
              reference: '#patient'
            authoredOn: '2026-08-05T10:14:30Z'
            requester:
              identifier:
                system: 'https://fhir.nhs.uk/Id/ods-organization-code'
                value: RX898
              display: Example NHS Trust
            performer:
              - identifier:
                  system: 'https://fhir.nhs.uk/Id/ods-organization-code'
                  value: 8JK09
                display: Example DTx Provider
    '400':
      $ref: '../responses/BadRequest.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '429':
      $ref: '../responses/TooManyRequests.yaml'
    '503':
      $ref: '../responses/ServiceUnavailable.yaml'
