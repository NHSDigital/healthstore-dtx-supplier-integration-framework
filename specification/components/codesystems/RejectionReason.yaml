title: RejectionReason
description: |
  Why the platform rejected the registration. Set when businessStatus is
  rejected. The value set is not final.
type: object
required:
  - coding
properties:
  coding:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - system
        - code
      properties:
        system:
          type: string
          enum:
            - 'https://fhir.healthstore.nhs.uk/CodeSystem/rejection-reason'
        code:
          type: string
          enum:
            - not-licensed
            - duplicate
        display:
          type: string
          enum:
            - Not licensed for the commissioning body
            - Patient already registered
  text:
    type: string
