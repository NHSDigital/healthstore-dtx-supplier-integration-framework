title: TaskCode
description: The scope of a registration request.
type: object
required:
  - coding
properties:
  coding:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - system
        - code
      properties:
        system:
          type: string
          enum:
            - 'https://fhir.healthstore.nhs.uk/CodeSystem/task-code'
        code:
          type: string
          enum:
            - process-specific-service-request
            - process-available-service-requests
        display:
          type: string
          enum:
            - Process specific service request
            - Process available service requests
