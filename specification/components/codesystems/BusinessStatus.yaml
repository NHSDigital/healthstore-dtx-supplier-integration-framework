title: BusinessStatus
description: |
  The domain state of the registration, reported by the DTx platform. In v1.0
  the two states that answer a registration: registered and rejected.
  Activation, deactivation and off-boarding follow in the lifecycle
  specification.
type: object
required:
  - coding
properties:
  coding:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - system
        - code
      properties:
        system:
          type: string
          enum:
            - 'https://fhir.dtx.national.nhs.uk/CodeSystem/registration-business-status'
        code:
          type: string
          enum:
            - registered
            - rejected
        display:
          type: string
          enum:
            - Registered
            - Rejected
  text:
    type: string
