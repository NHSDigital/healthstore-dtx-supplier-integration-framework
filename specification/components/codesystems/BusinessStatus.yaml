title: BusinessStatus
description: |
  The domain state of the registration, reported by the platform. registered
  and rejected answer the registration request; activated and deactivated
  follow later in the registration's life.
type: object
required:
  - coding
properties:
  coding:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - system
        - code
      properties:
        system:
          type: string
          enum:
            - 'https://fhir.healthstore.nhs.uk/CodeSystem/registration-business-status'
        code:
          type: string
          enum:
            - registered
            - rejected
            - activated
            - deactivated
        display:
          type: string
          enum:
            - Registered
            - Rejected
            - Activated
            - Deactivated
  text:
    type: string
