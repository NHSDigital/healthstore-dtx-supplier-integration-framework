title: LifecycleTask
description: |
  A lifecycle Task acknowledging the registration. status takes a
  task-status value and describes the Task itself; businessStatus gives
  the registration's state; statusReason gives the coded reason.

  Rules the schema alone cannot express, checked by HealthStore:
  already-registered is valid only with businessStatus registered; every
  other statusReason is valid only with rejected, where a statusReason is
  required; note is required where statusReason is other.
type: object
required:
  - resourceType
  - status
  - intent
  - businessStatus
properties:
  resourceType:
    type: string
    enum:
      - Task
  status:
    type: string
    enum:
      - draft
      - requested
      - received
      - accepted
      - rejected
      - ready
      - cancelled
      - in-progress
      - on-hold
      - failed
      - completed
      - entered-in-error
  intent:
    type: string
    enum:
      - unknown
      - proposal
      - plan
      - order
      - original-order
      - reflex-order
      - filler-order
      - instance-order
      - option
  businessStatus:
    $ref: '../codesystems/BusinessStatus.yaml'
  statusReason:
    $ref: '../codesystems/AcknowledgementReason.yaml'
  note:
    type: array
    minItems: 1
    description: Required where statusReason is other. Free text, no patient data.
    items:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
