                  text:
                    type: string
                    enum:
                      - activation_datetime
                      - first_therapeutic_activity_datetime
                      - latest_therapeutic_activity_datetime
                      - completion_datetime
              valueDateTime:
                type: string
                format: date-time
    InputIntervention:
      type: object
      description: "MDS `product_id` and `product_version`: the product as the Registration API names it. One coding whose system is an intervention code system (`https://fhir.dtx.national.nhs.uk/CodeSystem/intervention-<name>`, any name; only the shape is checked), with your code for the product and the version the patient used. The code is read as yours, whatever the name; `GET /eligibility-reference` lists your codes."
      additionalProperties: false
      required:
        - type
        - valueCodeableConcept
      properties:
        type:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              enum:
                - intervention
        valueCodeableConcept:
          type: object
          additionalProperties: false
          required:
            - coding
          properties:
            coding:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  - system
                  - code
                  - version
                properties:
                  system:
                    type: string
                    pattern: ^https://fhir\.dtx\.national\.nhs\.uk/CodeSystem/intervention-[a-z0-9-]+$
                  code:
                    type: string
