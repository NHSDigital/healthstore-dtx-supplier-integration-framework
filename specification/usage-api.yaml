    UsageReportBundle:
      type: object
      description: "FHIR R4 `Bundle` (type `collection`) containing exactly one `Patient` and one `Task`, in either order. (The `oneOf` below describes each entry's possible types; the one-of-each rule itself is checked at submission and violations return `MALFORMED_BUNDLE`.) The profile is strict: any element not listed here is rejected, so a submission that validates against your FHIR tooling can still be rejected if it carries extra fields."
      additionalProperties: false
      required:
        - resourceType
        - type
        - entry
      example:
        resourceType: Bundle
        type: collection
        entry:
          - resource:
              resourceType: Patient
              identifier:
                - system: https://fhir.nhs.uk/Id/nhs-number
                  value: "9990000018"
              birthDate: 1958-03-14
          - resource:
              resourceType: Task
              status: in-progress
              intent: order
              basedOn:
                - identifier:
                    system: https://fhir.dtx.national.nhs.uk/Id/registration
                    value: 0b93b9a2-6ac2-4d31-a3d0-7c3ef1a29a3f
              requester:
                identifier:
                  system: https://fhir.nhs.uk/Id/ods-organization-code
                  value: QHS1
              businessStatus:
                text: Open
              lastModified: 2026-08-20T10:15:00Z
              input:
                - type:
                    text: intervention
                  valueCodeableConcept:
                    coding:
                      - system: https://fhir.dtx.national.nhs.uk/CodeSystem/intervention-example
                        code: example
                        version: 2.3.1
                - type:
                    text: registration_route
                  valueString: HealthStore
                - type:
                    text: completion_applicable
                  valueBoolean: false
              output:
                - type:
                    text: activation_datetime
                  valueDateTime: 2026-08-20T09:58:00Z
      properties:
        resourceType:
          type: string
          enum:
            - Bundle
        type:
          type: string
          enum:
            - collection
        entry:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required:
              - resource
            properties:
              resource:
                oneOf:
                  - $ref: "#/components/schemas/PatientResource"
                  - $ref: "#/components/schemas/TaskResource"
    PatientResource:
      type: object
      additionalProperties: false
      required:
        - resourceType
        - identifier
        - birthDate
      properties:
        resourceType:
          type: string
          enum:
            - Patient
        identifier:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
