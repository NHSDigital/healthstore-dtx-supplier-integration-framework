        intent:
          type: string
          enum:
            - order
            - plan
            - proposal
        basedOn:
          type: array
          minItems: 1
          maxItems: 1
          description: MDS `healthstore_request_id` — the registration id HealthStore issued for the clinician's request, the same identifier the Registration API uses. Include it exactly when registration_route is 'HealthStore'; omit it entirely for 'Self-Referral' records.
          items:
            type: object
            additionalProperties: false
            required:
              - identifier
            properties:
              identifier:
                type: object
                additionalProperties: false
                required:
                  - system
                  - value
                properties:
                  system:
                    type: string
                    enum:
                      - https://fhir.dtx.national.nhs.uk/Id/registration
                  value:
                    type: string
        requester:
          type: object
          additionalProperties: false
          required:
            - identifier
          properties:
            identifier:
              type: object
              additionalProperties: false
              required:
                - system
                - value
              properties:
                system:
                  type: string
                  enum:
                    - https://fhir.nhs.uk/Id/ods-organization-code
                value:
                  type: string
                  example: QHS1
                  description: "MDS `commissioning_org_ods_code` — the contracting organisation: who bought the product and is billed, and who the figures are reported against. Required on every submission. For Self-Referral records this states which organisation's HealthStore agreement the recruitment channel was deployed under — it is the record's legal basis for flowing to HSRS, so take care to map channels to the right organisation."
        businessStatus:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              enum:
                - Open
                - Paused
                - Closed
              description: MDS `user_account_status`.
        lastModified:
          type: string
          format: date-time
          description: MDS `record_timestamp` — ISO datetime with explicit offset; ≤ 5 min ahead of server time.
        input:
          type: array
          description: "`intervention` and `registration_route` are required on every submission; `completion_applicable` on the first (full) submission. The correction pair must appear together."
          items:
            oneOf:
              - $ref: "#/components/schemas/InputIntervention"
              - $ref: "#/components/schemas/InputRegistrationRoute"
              - $ref: "#/components/schemas/InputCompletionApplicable"
              - $ref: "#/components/schemas/InputCorrection"
              - $ref: "#/components/schemas/InputCorrectsSubmissionId"
        output:
