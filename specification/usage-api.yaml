        identifier:
          system: https://fhir.dtx.national.nhs.uk/Id/usage-report-batch
          value: 2a4c6e8f-1b3d-4f5a-9c8e-7d6b5a4c3e2f
        type: batch-response
        entry:
          - response:
              status: 202 Accepted
            resource:
              resourceType: Task
              id: 7f3c9a1e-5b2d-4c8e-9f10-6a7b8c9d0e1f
              identifier:
                - system: https://fhir.dtx.national.nhs.uk/Id/usage-report-submission
                  value: 7f3c9a1e-5b2d-4c8e-9f10-6a7b8c9d0e1f
              status: received
              statusReason:
                coding:
                  - system: https://fhir.dtx.national.nhs.uk/CodeSystem/usage-report-status
                    code: received
              intent: order
              authoredOn: 2026-08-20T10:16:02.114Z
              lastModified: 2026-08-20T10:15:00Z
              requester:
                identifier:
                  system: https://fhir.nhs.uk/Id/ods-organization-code
                  value: QHS1
              businessStatus:
                text: Open
